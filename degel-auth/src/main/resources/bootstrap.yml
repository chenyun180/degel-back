server:
  # 仅监听回环：服务端口不对局域网暴露，杜绝绕过网关直连伪造 X-User-*/X-Shop-* 头（生产用网络隔离替代）
  address: 127.0.0.1
  port: 9200

spring:
  application:
    name: degel-auth
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
        # 固定注册地址：本机 IP 变化后旧注册 IP 失效，服务间 Feign 调用会 502；本机集群统一走 127.0.0.1
        ip: 127.0.0.1
  redis:
    host: 192.168.1.14
    port: 6379
    password: ${REDIS_PASSWORD:root12345}

degel:
  security:
    # 管理端 JWT 密钥：生产必须用环境变量 JWT_SECRET 覆盖默认值（与 degel-gateway 保持一致）
    jwt-secret: ${JWT_SECRET:degel-jwt-secret-key-2024-platform-admin}
  oauth:
    # OAuth2 client 凭据：默认值仅供本地开发（前端 proxy 与 e2e 依赖），生产必须覆盖
    client-id: ${OAUTH_CLIENT_ID:degel}
    client-secret: ${OAUTH_CLIENT_SECRET:degel_secret}
