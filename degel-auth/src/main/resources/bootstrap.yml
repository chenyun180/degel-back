server:
  # 仅监听回环：服务端口不对局域网暴露，杜绝绕过网关直连伪造 X-User-*/X-Shop-* 头（生产用网络隔离替代）
  address: 127.0.0.1
  port: 9200

spring:
  application:
    name: degel-auth
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
        # 固定注册地址：本机 IP 变化后旧注册 IP 失效，服务间 Feign 调用会 502；本机集群统一走 127.0.0.1
        ip: 127.0.0.1
  redis:
    host: 192.168.1.14
    port: 6379
    password: ${REDIS_PASSWORD}

degel:
  # 出站给 degel-admin /user/find 的 X-Inner-Token（M2 修复：admin 侧 InnerTokenFilter 校验）
  # 严格模式，无默认值——未配置环境变量 INNER_TOKEN 直接启动失败
  inner:
    token: ${INNER_TOKEN}
  security:
    # 管理端 JWT 密钥：严格模式，无默认值——未配置环境变量 JWT_SECRET 直接启动失败（H3 修复）
    jwt-secret: ${JWT_SECRET}
  oauth:
    # OAuth2 client 凭据：client-id 非机密可留默认；secret 严格模式无默认值（H3 修复）
    client-id: ${OAUTH_CLIENT_ID:degel}
    client-secret: ${OAUTH_CLIENT_SECRET}
