server:
  port: 9999

spring:
  application:
    name: degel-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
    gateway:
      routes:
        - id: auth-route
          uri: lb://degel-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: admin-route
          uri: lb://degel-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        - id: file-route
          uri: lb://degel-file
          predicates:
            - Path=/file/**
        - id: product-route
          uri: lb://degel-product
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: order-route
          uri: lb://degel-order
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: app-route
          uri: lb://degel-app
          predicates:
            - Path=/app/**
  redis:
    host: 192.168.1.14
    port: 6379
    password: root12345

degel:
  security:
    jwt-secret: degel-jwt-secret-key-2024-platform-admin
    ignore-urls:
      - /auth/oauth/token
      - /app/
    internal-urls:
      - /admin/user/find/
      - /inner/
    # admin-urls 为前缀匹配（startsWith），如 "*:/admin/user" 也会命中 /admin/users/export 等未来新增路径
    admin-urls:
      - "*:/admin/user"
      - "*:/admin/role"
      - "*:/admin/menu"
      - "*:/admin/shop"
      - "PUT:/product/spu/audit"
      - "POST:/product/category"
      - "PUT:/product/category"
      - "DELETE:/product/category"
      # 平台工作台数据看板（前缀恰好覆盖 /overview 与 /trend，勿放宽为 /order/platform）
      - "GET:/order/platform/dashboard"
    # admin-url-excludes 为 admin-urls 的例外（登录用户自服务接口），优先级高于 admin-urls
    admin-url-excludes:
      - "GET:/admin/user/info"
      - "*:/admin/shop/mine"
