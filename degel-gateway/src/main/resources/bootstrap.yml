server:
  port: 9999

spring:
  application:
    name: degel-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
        # 固定注册地址：本机 IP 变化后旧注册 IP 失效，服务间 Feign 调用会 502；本机集群统一走 127.0.0.1
        ip: 127.0.0.1
    gateway:
      # XFF 追加显式化（低危修复配套）：网关把真实 remoteAddr 追加到 X-Forwarded-For 尾部，
      # auth/app 的限流器据此取"最后一段"为真实 IP——攻击者只能前插伪造段绕不过
      x-forwarded:
        enabled: true
        for-append: true
      routes:
        - id: auth-route
          uri: lb://degel-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: admin-route
          uri: lb://degel-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        - id: file-route
          uri: lb://degel-file
          predicates:
            - Path=/file/**
        - id: product-route
          uri: lb://degel-product
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: order-route
          uri: lb://degel-order
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: app-route
          uri: lb://degel-app
          predicates:
            - Path=/app/**
        # 优惠券：C 端入口在 degel-app(/app/coupon)，marketing 只承接平台管理 + 内部接口
        - id: marketing-route
          uri: lb://degel-marketing
          predicates:
            - Path=/marketing/**
          filters:
            - StripPrefix=1
  redis:
    host: 192.168.1.14
    port: 6379
    password: ${REDIS_PASSWORD}

degel:
  # CORS 白名单（低危修复后为真实属性，单一来源）：开发默认含局域网通配（真机/局域网浏览器
  # 访问 dev server 的常见形态）；prod profile 下含通配符会被 SecurityStartupCheck 拒绝启动，
  # 生产必须用 DEGEL_CORS_ORIGINS 注入真实域名
  cors:
    origins: ${DEGEL_CORS_ORIGINS:http://localhost:8000,http://localhost:10087,http://127.0.0.1:8000,http://127.0.0.1:10087,http://192.168.1.*:8000,http://192.168.1.*:10087}
  security:
    # 管理端 JWT 密钥：严格模式，无默认值——未配置环境变量 JWT_SECRET 直接启动失败（H3 修复）
    jwt-secret: ${JWT_SECRET}
    # C 端 JWT 密钥：与 degel-app 的 APP_JWT_SECRET 一致（网关统一校验 c_end 令牌用），同样严格模式
    app-jwt-secret: ${APP_JWT_SECRET}
    ignore-urls:
      - /auth/oauth/token
      - /app/
      # 公开桶图片走 <img> 直链（无 Authorization header），必须放行；
      # 只放行公开桶路径，私有桶仍需 token 或 presign
      - /file/view/degel-public/
    internal-urls:
      - /admin/user/find/
      - /inner/
      # degel-app 内部接口经网关路由后的路径（H1 修复：此前漏配，/app/inner/** 可经网关公网端口
      # 触达，仅靠仓库内默认 INNER_TOKEN 保护，可伪造任意订单退款）
      - /app/inner/
      # degel-product 内部接口经网关路由后的路径（Feign 直连不走网关，不受影响）
      - /product/inner/
      # degel-order 内部接口经网关路由后的路径
      - /order/inner/
      # degel-marketing 内部接口（锁券/核销等，X-Inner-Token + 内网双重保护）
      - /marketing/inner/
    # admin-urls 为前缀匹配（startsWith），如 "*:/admin/user" 也会命中 /admin/users/export 等未来新增路径
    admin-urls:
      - "*:/admin/user"
      - "*:/admin/role"
      - "*:/admin/menu"
      - "*:/admin/shop"
      # 平台结算管理（提现审核/佣金配置）
      - "*:/order/platform/settlement"
      # 平台售后仲裁
      - "*:/order/platform/aftersale"
      # 平台搜索词分析（product 平台侧报表）
      - "*:/product/platform"
      - "PUT:/product/spu/audit"
      # ES 索引全量重建（平台管理动作）
      - "POST:/product/spu/reindex"
      # 平台券管理（仅平台角色；C 端入口走 degel-app 的 /app/coupon）
      - "*:/marketing/platform"
      - "POST:/product/category"
      - "PUT:/product/category"
      - "DELETE:/product/category"
      # 平台工作台数据看板（前缀恰好覆盖 /overview 与 /trend，勿放宽为 /order/platform）
      - "GET:/order/platform/dashboard"
      # 文件管理接口仅平台管理员（2026-09-22 M1 修复：list/presign/delete 此前任意店铺
      # token 可调用且服务端无归属校验，可枚举/预签/删除任意桶含私有桶对象。全库前端只用
      # upload 与 view，故直接收进平台权限；DELETE:/file 前缀匹配不影响 GET view）
      - "GET:/file/list"
      - "GET:/file/presign"
      - "DELETE:/file"
    # admin-url-excludes 为 admin-urls 的例外（登录用户自服务接口），优先级高于 admin-urls
    admin-url-excludes:
      - "GET:/admin/user/info"
      - "*:/admin/shop/mine"
