server:
  port: 9999

spring:
  application:
    name: degel-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
    gateway:
      routes:
        - id: auth-route
          uri: lb://degel-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: admin-route
          uri: lb://degel-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        - id: file-route
          uri: lb://degel-file
          predicates:
            - Path=/file/**
        - id: product-route
          uri: lb://degel-product
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: order-route
          uri: lb://degel-order
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: app-route
          uri: lb://degel-app
          predicates:
            - Path=/app/**
        # 优惠券：C 端入口在 degel-app(/app/coupon)，marketing 只承接平台管理 + 内部接口
        - id: marketing-route
          uri: lb://degel-marketing
          predicates:
            - Path=/marketing/**
          filters:
            - StripPrefix=1
  redis:
    host: 192.168.1.14
    port: 6379
    password: root12345

degel:
  security:
    # 管理端 JWT 密钥：生产必须用环境变量 JWT_SECRET 覆盖默认值（与 degel-auth 保持一致）
    jwt-secret: ${JWT_SECRET:degel-jwt-secret-key-2024-platform-admin}
    # C 端 JWT 密钥：与 degel-app 的 APP_JWT_SECRET 一致（网关统一校验 c_end 令牌用）
    app-jwt-secret: ${APP_JWT_SECRET:degel-c-end-secret-key-2024-change-in-prod}
    ignore-urls:
      - /auth/oauth/token
      - /app/
      # 公开桶图片走 <img> 直链（无 Authorization header），必须放行；
      # 只放行公开桶路径，私有桶仍需 token 或 presign
      - /file/view/degel-public/
    internal-urls:
      - /admin/user/find/
      - /inner/
      # degel-product 内部接口经网关路由后的路径（Feign 直连不走网关，不受影响）
      - /product/inner/
      # degel-order 内部接口经网关路由后的路径
      - /order/inner/
      # degel-marketing 内部接口（锁券/核销等，X-Inner-Token + 内网双重保护）
      - /marketing/inner/
    # admin-urls 为前缀匹配（startsWith），如 "*:/admin/user" 也会命中 /admin/users/export 等未来新增路径
    admin-urls:
      - "*:/admin/user"
      - "*:/admin/role"
      - "*:/admin/menu"
      - "*:/admin/shop"
      - "PUT:/product/spu/audit"
      # ES 索引全量重建（平台管理动作）
      - "POST:/product/spu/reindex"
      # 平台券管理（仅平台角色；C 端入口走 degel-app 的 /app/coupon）
      - "*:/marketing/platform"
      - "POST:/product/category"
      - "PUT:/product/category"
      - "DELETE:/product/category"
      # 平台工作台数据看板（前缀恰好覆盖 /overview 与 /trend，勿放宽为 /order/platform）
      - "GET:/order/platform/dashboard"
    # admin-url-excludes 为 admin-urls 的例外（登录用户自服务接口），优先级高于 admin-urls
    admin-url-excludes:
      - "GET:/admin/user/info"
      - "*:/admin/shop/mine"
