server:
  # 仅监听回环：服务端口不对局域网暴露，杜绝绕过网关直连伪造 X-User-*/X-Shop-* 头（生产用网络隔离替代）
  address: 127.0.0.1
  port: 9201

spring:
  application:
    name: degel-admin
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
        # 固定注册地址：本机 IP 变化后旧注册 IP 失效，服务间 Feign 调用会 502；本机集群统一走 127.0.0.1
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.14:3306/degel_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # M3/M4 修复：凭据严格模式，无默认值——未配置环境变量直接启动失败，开发值由 degel.sh 导出
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  redis:
    host: 192.168.1.14
    port: 6379
    password: ${REDIS_PASSWORD}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.degel.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: StdOutImpl 已移除（2026-09-20 扫描低危项：全量 SQL 含手机号/地址打 stdout）
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

degel:
  inner:
    # M2 修复配套：InnerTokenFilter 校验 /user/find/** 与 /inner/** 的 X-Inner-Token
    # 严格模式，无默认值——未配置环境变量 INNER_TOKEN 直接启动失败（auth 的 FeignConfig 出站同值）
    token: ${INNER_TOKEN}
