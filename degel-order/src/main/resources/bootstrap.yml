server:
  port: 9204

spring:
  application:
    name: degel-order
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.14:3306/degel_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

degel:
  inner:
    # 出站给 degel-marketing 的 X-Inner-Token（与 marketing 校验值一致）
    token: ${INNER_TOKEN:degel-inner-service-token-2024}
