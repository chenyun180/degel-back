server:
  # 仅监听回环：服务端口不对局域网暴露，杜绝绕过网关直连伪造 X-User-*/X-Shop-* 头（生产用网络隔离替代）
  address: 127.0.0.1
  port: 9206

spring:
  application:
    name: degel-marketing
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
        # 固定注册地址：本机 IP 变化后旧注册 IP 失效，服务间 Feign 调用会 502；本机集群统一走 127.0.0.1
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.14:3306/degel_marketing?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # 秒杀预热数据在 app 侧的 DB1（SeckillRedisSync 增量同步用，key 布局见 app SeckillServiceImpl）
  redis:
    host: ${REDIS_HOST:192.168.1.14}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:root12345}
    database: 1

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.degel.marketing.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 券 id 用雪花（前端 JS 精度坑，出参统一 ToStringSerializer 转字符串）
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

degel:
  inner:
    # 与 degel-app FeignConfig 发送的 X-Inner-Token 一致（inner 接口鉴权）
    token: ${INNER_TOKEN:degel-inner-service-token-2024}
