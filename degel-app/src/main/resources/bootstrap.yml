server:
  # 仅监听回环：服务端口不对局域网暴露，杜绝绕过网关直连伪造 X-User-*/X-Shop-* 头（生产用网络隔离替代）
  address: 127.0.0.1
  port: 9205

spring:
  application:
    name: degel-app
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.14:8848
        # 固定注册地址：本机 IP 变化后旧注册 IP 失效，服务间 Feign 调用会 502；本机集群统一走 127.0.0.1
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.14:3306/degel_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: 192.168.1.14
    port: 6379
    password: ${REDIS_PASSWORD:root12345}
    database: 1   # C端独立 DB，与 admin 端隔离
  security:
    ignored: "/**"   # 关闭 Spring Security 默认拦截，由 AppSecurityFilter 接管

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

degel:
  app:
    jwt:
      secret: ${APP_JWT_SECRET:degel-c-end-secret-key-2024-change-in-prod}
      expiration: 604800   # 7天，单位秒
    # 文件访问基地址（C 端拼图片绝对 URL 用；生产改为公网网关/CDN 域名）
    file-base-url: ${FILE_BASE_URL:http://localhost:9999}
  inner:
    token: ${INNER_TOKEN:degel-inner-service-token-2024}
  wx:
    appid: ${WX_APPID:your-wx-appid}
    secret: ${WX_SECRET:your-wx-secret}
    token-url: https://api.weixin.qq.com/sns/jscode2session

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
  circuitbreaker:
    enabled: true

# circuitbreaker.enabled=true 后 Feign 调用被 resilience4j TimeLimiter 包裹，
# 不配置时默认 1s 超时，比上面的 read-timeout 更先触发，负载抖动会造成
# "服务端已提交、客户端报降级"的假故障（2026-09-14 评价提交实际入库但前端报错）。
# 此处对齐 read-timeout。
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
